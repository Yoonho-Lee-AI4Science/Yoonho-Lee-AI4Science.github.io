<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  {% if page.math %}
  <script>window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };</script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
  {% endif %}
</head>
<body>
  <nav class="topnav">
    <div class="nav-inner">
      <a class="brand" href="/">{{ site.title }}</a>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/#pub">Publications</a></li>
        <li><a href="/blog/">Blog</a></li>
      </ul>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
    </div>
  </nav>
  <main class="container">
    {{ content }}
  </main>
  <footer>© <span id="year"></span> {{ site.title }} · Last updated {{ site.time | date: "%Y.%m.%d" }}</footer>
  <script src="/js/main.js"></script>
</body>
</html>
