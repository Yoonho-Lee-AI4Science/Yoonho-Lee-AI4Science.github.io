---
layout: base
title: Blog
---
<h2 style="margin-top:8px">Blog</h2>
<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <span class="date">{{ post.date | date: "%Y.%m.%d" }}</span>
    <a href="{{ post.url }}">{{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
{% if site.posts.size == 0 %}<p class="note">No posts yet.</p>{% endif %}
